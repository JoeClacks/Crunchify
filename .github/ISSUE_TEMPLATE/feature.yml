name: Suggest a tool or change
description: A new tool, or something an existing one should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public.** Don't paste passwords, tokens or personal details.
  - type: input
    id: tool
    attributes:
      label: Tool, if it's about one
      placeholder: Leave empty for a new tool
  - type: textarea
    id: want
    attributes:
      label: What you'd like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it's for
      description: The job you're trying to get done. It helps us choose between ways of building it.
